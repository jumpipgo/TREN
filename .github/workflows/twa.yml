name: Build TWA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"

      - name: Restore signing key
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TWA_KEYSTORE_BASE64" | base64 --decode > android-keystore.p12
          chmod 600 android-keystore.p12

      - name: Generate TWA project
        run: bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest=.

      - name: Package APK and Digital Asset Links
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p twa-artifacts
          apk="$(find . -name app-release-signed.apk -print -quit)"
          test -n "$apk"
          cp "$apk" twa-artifacts/meso-twa.apk
          fingerprint="$(keytool -list -v -keystore android-keystore.p12 -alias meso -storepass "$TWA_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':')"
          test -n "$fingerprint"
          printf '%s\n' "$fingerprint" > twa-artifacts/sha256-fingerprint.txt
          cat > twa-artifacts/assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.jumpipgo.meso",
                "sha256_cert_fingerprints": ["$fingerprint"]
              }
            }
          ]
          JSON
          cat twa-artifacts/assetlinks.json

      - name: Upload TWA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meso-twa
          path: twa-artifacts
